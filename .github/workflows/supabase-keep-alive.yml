name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC (Supabase pauses after 7 days of inactivity)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://emzvjrvnwjaxgfkbrlve.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtenZqcnZud2pheGdma2JybHZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0MTM3NzYsImV4cCI6MjA4Mzk4OTc3Nn0.xIgkjs-gvHtTxhJyiCrVP0PZEArXYQErWABdvO5n8sY' }}
        run: |
          echo "Sending keep-alive ping to Supabase..."
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/system_settings?select=id&limit=1")
          
          echo "HTTP Response Status: $HTTP_STATUS"
          cat response.txt
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Supabase is active and responding. Inactivity timer reset."
          else
            echo "❌ Failed with status $HTTP_STATUS"
            exit 1
          fi
